name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test && npm run build
      - name: Publish release and single HTML
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if ("v"+JSON.parse(fs.readFileSync("package.json")).version!==process.env.RELEASE_TAG) process.exit(1)'
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Reviewer $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/reviewer.html --clobber
