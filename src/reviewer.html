<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Reviewer</title><link rel="icon" type="image/svg+xml" href="./reviewer-icon.svg"><link rel="manifest" href="./reviewer.webmanifest"><meta name="theme-color" content="#305dc5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reviewer"><link rel="stylesheet" href="./reviewer.css"></head><body>
<div class="app-shell">
<div class="sidebar-rail"><aside id="sidebar" aria-label="学習セットのサイドバー">
<div class="sidebar-fixed"><div class="sidebar-head"><button type="button" class="home-link" id="homeLink" aria-label="Reviewer ホーム">Reviewer</button><div class="sidebar-head-tools"><button id="toggleSearch" class="icon-btn" aria-label="学習セットを検索" aria-controls="sidebarSearch" aria-expanded="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><span id="sidebarToggleSlot"></span></div></div>
<div id="sidebarSearch" class="search-disclosure" inert aria-hidden="true"><div class="search-disclosure-inner"><div class="set-search"><input id="setSearch" type="search" placeholder="学習セットを検索" aria-label="学習セットを検索"></div></div></div>
<div class="home-actions">
<button id="newSet" class="primary"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>作成</span></button>
</div></div><div class="sidebar-scroll"><div class="home-actions">
<button id="showImport"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg><span>インポート</span></button>
<button id="showExport"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></svg><span>エクスポート</span></button>
</div>

<details id="localSection" class="sidebar-section" open><summary>学習セット</summary><button type="button" class="sort-toggle icon-btn" data-sort="setSort" aria-label="学習セットの並び順を選ぶ" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg></button><select hidden id="setSort" aria-label="学習セットの並び順"><option value="title:asc">名前 · 昇順</option><option value="title:desc">名前 · 降順</option><option value="createdAt:desc">作成日時 · 新しい順</option>
<option value="createdAt:asc">作成日時 · 古い順</option>
<option value="lastStudiedAt:desc">最終学習日時 · 新しい順</option>
<option value="lastStudiedAt:asc">最終学習日時 · 古い順</option>
<option value="updatedAt:desc">最終変更日時 · 新しい順</option>
<option value="updatedAt:asc">最終変更日時 · 古い順</option>
</select><div id="setGrid" class="set-grid"></div></details>

</div></aside></div>
<button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="サイドバーを閉じる" tabindex="-1" aria-hidden="true"></button>
<div class="right-pane">
<header class="workspace-header"><span id="workspaceToggleSlot"><button id="toggleSidebar" class="icon-btn" aria-label="サイドバーを切り替え" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></span><span id="workspaceTitle">Reviewer</span></header>
<main class="wrap" id="workspace">
<section id="sets" class="screen active dashboard" aria-labelledby="dashboardTitle">
<div class="dashboard-heading"><div><h1 id="dashboardTitle">学習の記録</h1></div><button id="browseSets">学習セットを選ぶ</button></div>
<div id="dashboardMetrics" class="dashboard-metrics" aria-label="学習の累計"></div>

<section aria-labelledby="recommendationsTitle"><div class="dashboard-section-head"><h2 id="recommendationsTitle">おすすめの学習セット</h2></div><div id="dashboardRecommendations" class="dashboard-recommendations"></div></section>
<section aria-labelledby="weakCardsTitle"><div class="dashboard-section-head"><h2 id="weakCardsTitle">苦手なカード</h2></div><div id="dashboardWeakCards" class="dashboard-weak-list"></div></section>
<footer class="dashboard-footer"><a class="github-link" href="https://github.com/kntt32/reviewer" target="_blank" rel="noopener noreferrer">github.com/kntt32/reviewer <span aria-hidden="true">↗</span></a></footer>
</section>
<section id="list" class="screen">
<button class="back-link" id="back"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> 学習セット</button>
<div class="set-info"><h2 id="setTitle"></h2><p id="setDesc" class="muted"></p></div>
<div class="study-actions">
<button id="openCards" class="primary"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h8a4 4 0 0 1 4 4v11a4 4 0 0 0-4-4H3zM15 9a4 4 0 0 1 4-4h2v11h-2a4 4 0 0 0-4 4"/></svg> 単語カード</button>
<button id="openQuiz"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9a3 3 0 1 1 5 2c-1 1-2 1-2 3M12 18h.01M12 2a10 10 0 1 0 .01 0"/></svg> クイズ</button>
</div>
<div class="row"><h2 class="list-heading" style="margin:0">カード一覧</h2><div class="detail-tools"><button id="editSet" aria-label="セットを編集"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16 4l4 4-11 11-4 1 1-4z"/></svg></button><button id="deleteSet" class="danger" aria-label="セットを削除"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v7M14 11v7M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></div>
<div class="stats" id="stats"></div>
<div class="toolbar"><div class="entry-search" style="flex:1;min-width:175px"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 0 0 0-16m6 14 4 4"/></svg><input id="search" placeholder="カードを検索" type="search"></div><select id="filter"><option value="all">すべて</option><option value="weak">苦手</option></select><button class="primary" id="newItem"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 追加</button></div>
<div id="items" class="stack"></div>
</section>
<section id="cards" class="screen">
<button class="back-link" data-detail-back><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> セットに戻る</button>
<div class="panel stack"><div class="row"><strong id="cardTitle"></strong><span id="cardCount" class="muted"></span></div>
<div class="toolbar"><select id="cardScope"><option value="all">すべて</option><option value="weak">苦手</option></select><button id="shuffle">シャッフル</button><button id="restartCards">最初から</button></div>
<div class="bar"><div id="cardBar"></div></div><div class="flash" id="flash"></div>
<div class="actions"><button id="prev">前へ</button><button id="flip" class="primary">答えを見る</button><button id="next">次へ</button></div>
<div class="actions" id="grades" hidden><button data-grade="wrong">覚えていない</button><button data-grade="hard">難しかった</button><button data-grade="good" class="primary">覚えた</button></div></div>
</section>
<section id="quiz" class="screen">
<button class="back-link" data-detail-back><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> セットに戻る</button>
<div class="panel stack"><div class="row"><strong id="quizTitle"></strong><span id="quizCount" class="muted"></span></div>
<div class="toolbar"><select id="quizScope"><option value="all">すべて</option><option value="weak">苦手</option></select><button id="startQuiz" class="primary">クイズ開始</button></div>
<div class="bar" aria-hidden="true"><div id="quizBar" style="width:0"></div></div>
<div id="quizBody" class="stack"></div></div>
</section>
</main></div></div>
<dialog id="createDialog"><form id="createForm" class="modal-pane">
<h2>新しい学習セット</h2>

<label>名前<input id="createTitle" required placeholder="セットの名前"></label>
<label>説明<textarea id="createDesc" rows="3" placeholder="学習する内容や目的"></textarea></label>
<div class="actions"><button id="cancelCreate" type="button">キャンセル</button><button class="primary" type="submit">作成する</button></div>
</form></dialog>
<dialog id="importDialog"><div class="modal-pane"><h2>インポート</h2>
<p class="muted small">JSONを貼り付けるか、ファイルを選択してください。</p>
<textarea id="jsonInput" rows="9" placeholder="JSONを貼り付け" spellcheck="false"></textarea>
<div class="actions"><button id="importJson" class="primary">読み込む</button><button id="example">形式の例</button></div>
<input type="file" id="file" accept=".json,application/json"><p id="message" class="muted small" role="status"></p>
<hr class="dialog-divider">
<h2>AIで学習セットを作成</h2>
<p class="muted small">作りたい教材を記入すると、JSON形式の指定を含んだプロンプトをコピーできます。</p>
<textarea id="topic" rows="4" placeholder="例：高校化学の無機分野から20項目、解説と4択問題付きで"></textarea>
<button id="copyPrompt"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h8a4 4 0 0 1 4 4v11a4 4 0 0 0-4-4H3zM15 9a4 4 0 0 1 4-4h2v11h-2a4 4 0 0 0-4 4"/></svg> AI用プロンプトをコピー</button><p id="copyStatus" class="muted small" role="status"></p>
</div></dialog>
<dialog id="exportDialog"><div class="modal-pane"><h2>エクスポート</h2>
<p class="muted small">すべての学習セットを書き出します。</p>
<button id="export" class="primary"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></svg> 教材JSONを書き出す</button>
<button id="backup"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></svg> 学習履歴を含めて書き出す</button>
<hr class="dialog-divider"><h2>データ管理</h2>
<div class="actions"><button id="reset">学習履歴を初期化</button><button id="clear" class="danger">すべて削除</button></div>
</div></dialog>
<dialog id="setDialog"><form id="setForm" class="form"><h2 id="setFormTitle">学習セット</h2><label>名前<input id="sTitle" required></label><label>説明<textarea id="sDesc" rows="3"></textarea></label><div class="actions"><button type="button" id="cancelSet">キャンセル</button><button class="primary">保存</button></div></form></dialog><dialog id="itemDialog"><form id="itemForm" class="form"><h2>カードの編集</h2><p id="itemMessage" class="danger" role="alert" hidden></p><label>表面<input id="iTerm" required></label><div class="image-editor"><label>表面の画像<input id="iImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif"></label><div class="image-preview" hidden><img id="iImagePreview" alt="表面の画像"><button type="button" data-remove-image="image" class="icon-btn" aria-label="表面の画像を削除"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M10 11v7M14 11v7M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></div><label>裏面<input id="iMeaning" required></label><div class="image-editor"><label>裏面の画像<input id="iAnswerImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif"></label><div class="image-preview" hidden><img id="iAnswerImagePreview" alt="裏面の画像"><button type="button" data-remove-image="answerImage" class="icon-btn" aria-label="裏面の画像を削除"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M10 11v7M14 11v7M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></div><label>解説<textarea id="iExplanation"></textarea></label><label>例・参考情報<textarea id="iExample"></textarea></label><label>例の解説<textarea id="iTranslation"></textarea></label><label>クイズの問題<input id="iQuestion" required></label><label>回答形式<select id="iResponseMode"><option value="choice">選択式</option><option value="free">自由回答</option></select></label><label id="freeAnswerField" hidden>正解例<textarea id="iAnswerText"></textarea></label><label id="choiceOptionsField">選択肢（4行）<textarea id="iOptions" required></textarea></label><label id="choiceAnswerField">正解<select id="iAnswer"><option value="0">1番</option><option value="1">2番</option><option value="2">3番</option><option value="3">4番</option></select></label><div class="actions"><button type="button" id="cancelItem">キャンセル</button><button class="primary">保存</button></div></form></dialog><dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><div class="dialog-layout"><div class="dialog-head"><h2 id="confirmTitle">確認</h2></div><div class="dialog-body"><p id="confirmMessage" class="detail"></p></div><div class="dialog-footer actions"><button id="confirmCancel" type="button" autofocus>キャンセル</button><button id="confirmAccept" type="button" class="primary">OK</button></div></div></dialog>
<div id="sortPopover" popover="auto" class="floating-menu" aria-labelledby="sortTitle"><h2 id="sortTitle" class="menu-heading">並び順</h2><div id="sortChoices" class="sort-choices" role="menu" aria-labelledby="sortTitle"></div></div>
<dialog id="explanationDialog" aria-labelledby="explanationTitle"><div class="dialog-layout"><div class="dialog-head"><h2 id="explanationTitle"></h2></div><div class="dialog-body"><p id="explanationMeaning" class="detail"></p><div id="explanationImages"></div><section id="explanationTextSection"><h3>解説</h3><p id="explanationText" class="detail"></p></section><section id="explanationExampleSection"><h3>例・参考情報</h3><p id="explanationExample" class="example"></p><p id="explanationTranslation" class="detail muted"></p></section><p id="explanationEmpty" class="muted" hidden>解説・例はまだありません。</p></div><div class="dialog-footer actions"><button type="button" data-close-dialog="explanationDialog">閉じる</button></div></div></dialog>
<div id="setActionsPopover" popover="auto" class="floating-menu" aria-labelledby="setActionsTitle"><h2 id="setActionsTitle" class="menu-heading"></h2><div class="set-menu-actions" role="menu" aria-labelledby="setActionsTitle"><button type="button" id="pinSetAction" role="menuitem">ピン留め</button><button type="button" id="renameSetAction" role="menuitem">名前変更</button><button type="button" id="exportSetAction" role="menuitem">このセットをエクスポート</button><button type="button" id="deleteSetAction" class="danger" role="menuitem">削除</button></div></div>
<dialog id="renameDialog" aria-labelledby="renameTitle"><form id="renameForm" class="dialog-layout"><div class="dialog-head"><h2 id="renameTitle">名前変更</h2></div><div class="dialog-body"><label>名前<input id="renameInput" required maxlength="200"></label></div><div class="dialog-footer actions"><button type="button" data-close-dialog="renameDialog">キャンセル</button><button type="submit" class="primary">保存</button></div></form></dialog>
<div id="storageStatus" role="alert" hidden><span id="storageMessage"></span><button type="button" id="storageRetry">再試行</button><button type="button" id="storageBackup">バックアップ</button></div>
<!-- MATH_RUNTIME -->
<script src="./reviewer.js"></script></body></html>
